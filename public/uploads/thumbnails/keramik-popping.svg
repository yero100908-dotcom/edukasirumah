<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C5C"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <!-- Ubin Keramik Kiri & Kanan -->
  <rect x="100" y="140" width="280" height="35" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="420" y="140" width="280" height="35" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="240" y="163" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">UBIN KERAMIK / GRANIT</text>
  <text x="560" y="163" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A" text-anchor="middle">UBIN KERAMIK / GRANIT</text>

  <!-- Celah Nat / Expansion Joint -->
  <line x1="400" y1="100" x2="400" y2="185" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4,4"/>
  <rect x="345" y="75" width="110" height="24" rx="4" fill="#F59E0B"/>
  <text x="400" y="91" font-family="sans-serif" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">CELAH NAT 2-3 MM</text>

  <!-- Pola Sisiran Roskam Mortar Instan (Double Buttering) -->
  <path d="M 100 185 Q 115 175 130 185 T 160 185 T 190 185 T 220 185 T 250 185 T 280 185 T 310 185 T 340 185 T 370 185 T 400 185 T 430 185 T 460 185 T 490 185 T 520 185 T 550 185 T 580 185 T 610 185 T 640 185 T 670 185 T 700 185 L 700 240 L 100 240 Z" fill="#64748B"/>
  <text x="400" y="218" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SEMEN PEREKAT MORTAR INSTAN BERGERIGI (C1/C2)</text>

  <!-- Screed Lantai Dasar -->
  <rect x="100" y="245" width="600" height="120" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="400" y="310" font-family="sans-serif" font-size="14" font-weight="bold" fill="#CBD5E1" text-anchor="middle">SCREED COR BETON DASAR (KERING &gt; 14 HARI)</text>

  <!-- Panah Anti Kopong -->
  <rect x="40" y="40" width="160" height="32" rx="6" fill="#C2410C"/>
  <text x="120" y="61" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">KERAMIK &amp; LANTAI</text>
</svg>

