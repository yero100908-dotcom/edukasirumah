  <rect x="430" y="140" width="250" height="200" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <text x="245" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">KERAMIK AREA BASAH</text>
  <text x="555" y="245" font-family="sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">KERAMIK AREA BASAH</text>

  <!-- Celah Nat Diisi Epoxy Grout 100% Kedap -->
