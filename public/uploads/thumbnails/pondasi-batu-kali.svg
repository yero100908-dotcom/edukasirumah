<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Sloof Beam -->
  <rect x="330" y="80" width="140" height="70" fill="#475569" stroke="#94A3B8" stroke-width="2"/>
  <text x="400" y="122" font-family="sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC" text-anchor="middle">SLOOF BETON 15x20</text>
  
  <!-- Pondasi Trapesium Batu Kali -->
  <polygon points="310,150 490,150 580,340 220,340" fill="#334155" stroke="#C2410C" stroke-width="3"/>
  <circle cx="340" cy="200" r="28" fill="#475569" stroke="#64748B"/>
  <circle cx="410" cy="195" r="32" fill="#475569" stroke="#64748B"/>
  <circle cx="470" cy="210" r="26" fill="#475569" stroke="#64748B"/>
  <circle cx="280" cy="270" r="34" fill="#475569" stroke="#64748B"/>
  <circle cx="360" cy="265" r="38" fill="#64748B" stroke="#94A3B8"/>
  <circle cx="445" cy="270" r="36" fill="#475569" stroke="#64748B"/>
  <circle cx="525" cy="280" r="30" fill="#475569" stroke="#64748B"/>
  <text x="400" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PASANGAN BATU KALI 1:4</text>
  
  <!-- Aanstamping Batu Kosong -->
  <rect x="180" y="340" width="440" height="50" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="400" y="372" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E2E8F0" text-anchor="middle">AANSTAMPING (BATU KOSONG) 20 CM</text>
  
  <!-- Pasir Urug -->
  <rect x="160" y="390" width="480" height="35" fill="#78350F" opacity="0.8"/>
  <text x="400" y="413" font-family="sans-serif" font-size="12" fill="#FEF3C7" text-anchor="middle">PASIR URUG PADAT 10 CM</text>
  
  <!-- Badge Kategori -->
  <rect x="40" y="40" width="180" height="32" rx="6" fill="#C2410C"/>
  <text x="130" y="61" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STRUKTUR &amp; PONDASI</text>
</svg>

