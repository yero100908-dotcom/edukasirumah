<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>

  <!-- Kotak Grease Trap Bawah Bak Cuci -->
  <rect x="180" y="120" width="440" height="280" rx="12" fill="#334155" stroke="#CBD5E1" stroke-width="3"/>
  
  <!-- Sekat 1: Saringan Padatan Sisa Makanan -->
  <rect x="220" y="160" width="90" height="160" fill="#475569" stroke="#94A3B8" stroke-dasharray="4,4"/>
  <text x="265" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F8FAFC" text-anchor="middle">KERANJANG PADATAN</text>

  <!-- Lapisan Lemak Minyak Mengapung (Minyak Lebih Ringan dari Air) -->
  <rect x="330" y="160" width="160" height="50" fill="#F59E0B" opacity="0.9"/>
  <text x="410" y="190" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle">LAPISAN LEMAK (GREASE)</text>

  <!-- Air Jernih di Bawah -->
  <rect x="330" y="215" width="160" height="150" fill="#0284C7" opacity="0.6"/>
  <text x="410" y="295" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AIR BEBAS LEMAK</text>

  <!-- Pipa Outlet Keluar Bersih -->
  <path d="M 500 320 L 580 320 L 580 200 L 660 200" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round"/>
  <text x="610" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">SALURAN KOTA</text>

  <!-- Badge Kategori -->
  <rect x="40" y="40" width="190" height="32" rx="6" fill="#C2410C"/>
  <text x="135" y="61" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PERAWATAN RUMAH TANGGA</text>
</svg>

